# Requires kube-prometheus-stack (Prometheus Operator).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: triton, namespace: inference, labels: {release: kube-prometheus-stack}}
spec:
  selector: {matchLabels: {app: triton}}
  endpoints: [{port: metrics, interval: 10s}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: vllm, namespace: inference, labels: {release: kube-prometheus-stack}}
spec:
  selector: {matchLabels: {app: vllm}}
  endpoints: [{port: http, path: /metrics, interval: 10s}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: gateway, namespace: inference, labels: {release: kube-prometheus-stack}}
spec:
  selector: {matchLabels: {app: gateway}}
  endpoints: [{port: http, path: /metrics, interval: 10s}]
