# Scale Triton on queueing, not CPU: GPU pods can be saturated while CPU looks idle.
# `triton_queue_us_per_request` is derived by prometheus-adapter (k8s/monitoring/prometheus-adapter.yaml)
# from nv_inference_queue_duration_us / nv_inference_request_success.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: triton-blue
  namespace: inference
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: triton-blue}
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Pods
      pods:
        metric: {name: triton_queue_us_per_request}
        target: {type: AverageValue, averageValue: "2000"}   # 2ms average queue time
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleUp: {stabilizationWindowSeconds: 0, policies: [{type: Percent, value: 100, periodSeconds: 30}]}
    scaleDown: {stabilizationWindowSeconds: 300, policies: [{type: Pods, value: 1, periodSeconds: 60}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: triton-green
  namespace: inference
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: triton-green}
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Pods
      pods:
        metric: {name: triton_queue_us_per_request}
        target: {type: AverageValue, averageValue: "2000"}
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleUp: {stabilizationWindowSeconds: 0, policies: [{type: Percent, value: 100, periodSeconds: 30}]}
    scaleDown: {stabilizationWindowSeconds: 300, policies: [{type: Pods, value: 1, periodSeconds: 60}]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: triton, namespace: inference}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: triton}
